name: CI Test Suite

on:
  push:
    branches: [ main, 'new/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install system dependencies for OpenCV
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock.txt

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -q --junitxml=output/local/test-results.xml

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Check portable native gate
      shell: bash
      run: |
        javac --release 8 -d output/local/java src/java_integration/*.java tests/java/NativeCaptureGateTest.java
        java -cp output/local/java NativeCaptureGateTest

    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: output/local/test-results.xml
