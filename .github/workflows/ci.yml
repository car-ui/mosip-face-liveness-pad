name: CI Test Suite

on:
  push:
    branches: [ main, 'new/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install system dependencies for OpenCV
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock.txt

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -q --junitxml=output/local/test-results.xml

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Check portable native gate
      shell: bash
      run: |
        javac --release 8 -d output/local/java src/java_integration/*.java tests/java/NativeCaptureGateTest.java
        java -cp output/local/java NativeCaptureGateTest
        javac --release 8 -d output/local/java integrations/native/common/io/mosip/facepad/BoundedMjpegReader.java integrations/native/tests/BoundedMjpegReaderCheck.java
        java -cp output/local/java BoundedMjpegReaderCheck

    - name: Set up desktop native runtime
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Check actual Java ONNX inference and rejection
      shell: bash
      run: |
        mkdir -p output/local/native-deps
        curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime/1.30.0/onnxruntime-1.30.0.jar -o output/local/native-deps/onnxruntime.jar
        curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/openpnp/opencv/4.5.3-4/opencv-4.5.3-4.jar -o output/local/native-deps/opencv.jar
        python scripts/check_native_engine.py --java-home "$JAVA_HOME" --onnx-jar output/local/native-deps/onnxruntime.jar --opencv-jar output/local/native-deps/opencv.jar

    - name: Preserve test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          output/local/test-results.xml
          output/local/native-check/native-engine-check.log
